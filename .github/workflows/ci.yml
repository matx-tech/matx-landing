name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  e2e:
    needs: quality
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --shard=${{ matrix.shard }}/4
        env:
          JUNIT_REPORT_PATH: test-results/junit-${{ matrix.shard }}.xml
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-results-${{ matrix.shard }}
          path: test-results/junit-${{ matrix.shard }}.xml
          retention-days: 7

  burn-in:
    needs: quality
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Burn-in P0 tests (flaky detection)
        run: |
          for i in {1..5}; do
            echo "=== Burn-in iteration $i/5 ==="
            pnpm exec playwright test --grep @p0 --reporter=line || exit 1
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: burn-in-failure
          path: test-results/
          retention-days: 7

  report:
    needs: e2e
    runs-on: ubuntu-24.04
    # Only aggregate when e2e actually ran — a skipped e2e (e.g. quality
    # failed) uploads no junit artifacts, and download-artifact would error.
    if: needs.e2e.result == 'success'
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: junit-results-*
          path: junit-results
          merge-multiple: true
      - name: Aggregate test results
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "Shard results collected: $(ls -1 junit-results/*.xml | wc -l)/4" >> $GITHUB_STEP_SUMMARY

  verify-live-headers:
    runs-on: ubuntu-24.04
    # Post-deploy assertion: the deployed site must serve the cross-origin
    # header policy (documents isolated, static assets cross-origin
    # embeddable). See scripts/verify-cross-origin-headers.sh. Runs on main
    # pushes (deploy follows from the VPS) and on manual dispatch.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify cross-origin header policy on matx.ee
        run: bash scripts/verify-cross-origin-headers.sh https://matx.ee

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v5.0.0
